[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-to-lua"
version = "0.1.0"
description = "Generate IceSL printer profiles with a Textual application."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual[syntax]>=8.2.8,<9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
printer-to-lua = "printer_to_lua.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printer_to_lua = ["assets/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]